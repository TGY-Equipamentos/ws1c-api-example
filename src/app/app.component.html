<main [style.background]="isPositive ? '#e7f6e7' : 'transparent'" style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <div style="text-align:center;max-width:480px;padding:24px;">
    <h1 style="margin:0 0 16px 0;font-weight:600;">WS1C - Peso Atual</h1>
    <div style="font-size:72px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:16px 0;">
      {{ valueDisplay }}
    </div>
    <p style="color:#666;margin-top:8px;">Atualiza automaticamente a cada 3s</p>
  </div>
</main>
